<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷题 - 刷题神器</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container quiz-container">
        <!-- 顶部导航 -->
        <header class="quiz-header">
            <button class="btn btn-back" onclick="window.location.href='/'">← 返回</button>
            <h1 class="quiz-title" id="quizTitle">加载中...</h1>
            <button class="btn btn-secondary btn-small" id="gridBtn" title="题号导航">≡</button>
        </header>

        <!-- 模式切换 + 进度 -->
        <div class="quiz-toolbar">
            <div class="mode-switcher">
                <button class="btn btn-small btn-primary mode-btn active" id="modeQuizBtn" data-mode="quiz">模拟模式</button>
                <button class="btn btn-small btn-secondary mode-btn" id="modeStudyBtn" data-mode="study">背题模式</button>
            </div>
            <div class="quiz-progress">
                <span id="currentNum">0</span> / <span id="totalNum">0</span>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="quiz-progress-bar">
            <div class="quiz-progress-fill" id="progressFill"></div>
        </div>

        <!-- 题号网格弹窗 -->
        <div class="modal-overlay" id="gridModal" style="display:none;">
            <div class="modal-card" style="max-width:520px;text-align:left;">
                <div class="modal-header">
                    <h2>题号导航</h2>
                    <button class="btn btn-back" id="closeGridBtn">✕</button>
                </div>
                <div style="padding:20px 24px;">
                    <div class="grid-legend">
                        <span class="grid-legend-item"><span class="grid-dot correct"></span> 正确</span>
                        <span class="grid-legend-item"><span class="grid-dot wrong"></span> 错误</span>
                        <span class="grid-legend-item"><span class="grid-dot unanswered"></span> 未做</span>
                        <span class="grid-legend-item"><span class="grid-dot marked"></span> 标注</span>
                    </div>
                    <div class="question-grid" id="questionGrid"></div>
                </div>
            </div>
        </div>

        <!-- 题目区域 -->
        <div class="question-card card" id="questionCard">
            <div class="question-meta">
                <span class="question-type" id="questionType">单选题</span>
                <span class="question-number" id="questionNumber">第 1 题</span>
                <button class="btn btn-small btn-mark" id="markBtn" title="标记此题">⚪</button>
            </div>
            
            <div class="question-stem" id="questionStem">
                加载中...
            </div>

            <div class="options-list" id="optionsList">
                <!-- 选项动态生成 -->
            </div>

            <!-- 背题模式：直接显示答案 -->
            <div class="study-answer" id="studyAnswerSection" style="display:none;">
                <div class="result-feedback correct" style="display:flex;">
                    <div class="result-icon">✓</div>
                    <div class="result-text" id="studyAnswerText">正确答案：A</div>
                </div>
            </div>

            <!-- 答题结果反馈（模拟模式） -->
            <div class="result-feedback" id="resultFeedback" style="display:none;">
                <div class="result-icon" id="resultIcon">✓</div>
                <div class="result-text" id="resultText">回答正确！</div>
            </div>

            <!-- 解析区域 -->
            <div class="explanation-section" id="explanationSection" style="display:none;">
                <div class="explanation-header">
                    <span>解析</span>
                    <button class="btn btn-small" id="genExplanationBtn" style="display:none;">AI生成解析</button>
                </div>
                <div class="explanation-content" id="explanationContent">
                    暂无解析
                </div>
            </div>
        </div>

        <!-- 底部操作 -->
        <div class="quiz-footer">
            <button class="btn btn-secondary" id="prevBtn" disabled>上一题</button>
            <button class="btn btn-primary" id="nextBtn" disabled>下一题</button>
        </div>

        <!-- 完成弹窗 -->
        <div class="modal-overlay" id="completeModal" style="display:none;">
            <div class="modal-card">
                <div class="modal-icon">🎉</div>
                <h2>答题完成！</h2>
                <div class="score-display">
                    <span class="score-num" id="scoreNum">0</span>
                    <span class="score-label">分</span>
                </div>
                <p class="score-detail">
                    共 <span id="totalQuestions">0</span> 题，
                    正确 <span id="correctCount">0</span> 题，
                    错误 <span id="wrongCount">0</span> 题
                </p>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="window.location.href='/'">返回首页</button>
                    <button class="btn btn-primary" id="restartBtn">重新答题</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.QUIZ_ID = "{{ quiz_id }}";
    </script>
    <script src="/static/quiz.js"></script>
</body>
</html>

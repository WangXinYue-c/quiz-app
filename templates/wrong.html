<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错题集 - 刷题神器</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header class="quiz-header" style="display:flex;align-items:center;gap:16px;padding:16px 0;">
            <button class="btn btn-back" onclick="window.location.href='/'">← 返回</button>
            <h1 class="quiz-title">❌ 错题集</h1>
            <div class="quiz-progress">
                <span id="wrongCount">0</span> 道错题
            </div>
        </header>

        <div id="wrongList">
            <div class="empty-state" style="padding:60px 20px;">
                <p style="font-size:48px;margin-bottom:16px;">🎉</p>
                <p>还没有错题，继续加油！</p>
            </div>
        </div>
    </div>

    <script src="/static/wrong.js"></script>
</body>
</html>
